<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>원생 관리 | Seolin SafeCheck</title>
    <link rel="stylesheet" href="../../src/styles/admin.css?v=phone-format-2">
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar" aria-label="관리자 메뉴">
        <div class="sidebar-brand">
          <img src="../../assets/images/seolin-logo-box.png" alt="서린태권도 로고">
          <div>
            <strong>Seolin SafeCheck</strong>
            <span>관리자</span>
          </div>
        </div>

        <nav class="admin-nav">
          <a href="../home/">대시보드</a>
          <a href="./" aria-current="page">원생 관리</a>
          <a href="../vehicles/">차량 관리</a>
          <a href="../schedules/">시간표 관리</a>
          <a href="../attendance/">출결 기록</a>
          <a href="#" aria-disabled="true" data-planned-nav>엑셀 관리 <span class="planned-label">준비 중</span></a>
          <a href="#" aria-disabled="true" data-planned-nav>SMS 설정 <span class="planned-label">준비 중</span></a>
        </nav>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div class="admin-user">
            <strong id="admin-display-name">관리자</strong>
            <span id="admin-account-id">계정 확인 중</span>
          </div>
          <button id="logout-button" class="secondary-button" type="button">로그아웃</button>
        </header>

        <section class="admin-content">
          <div class="page-title">
            <div>
              <p class="eyebrow">원생 관리</p>
              <h1>원생 목록</h1>
              <p>원생 정보와 보호자 연락처, 출결 대상 여부를 관리합니다. 목록에서는 연락처를 마스킹해 표시합니다.</p>
            </div>
            <button id="add-student-button" class="primary-button" type="button">원생 추가</button>
          </div>

          <div class="toolbar">
            <input
              id="student-search"
              class="search-input"
              type="search"
              placeholder="원생 이름 검색"
              aria-label="원생 이름 검색"
            >
            <p id="student-message" class="message" role="status" aria-live="polite"></p>
          </div>

          <section class="panel table-panel" aria-label="원생 목록">
            <table class="data-table">
              <thead>
                <tr>
                  <th scope="col">원생 이름</th>
                  <th scope="col">탑승 장소</th>
                  <th scope="col">보호자 연락처</th>
                  <th scope="col">상태</th>
                  <th scope="col">작업</th>
                </tr>
              </thead>
              <tbody id="student-table-body"></tbody>
            </table>
          </section>
        </section>
      </main>
    </div>

    <dialog id="student-dialog" class="student-dialog">
      <form id="student-form" class="form-stack" method="dialog" novalidate>
        <h2 id="student-dialog-title">원생 추가</h2>
        <input id="student-id" type="hidden">

        <label class="field">
          <span>원생 이름</span>
          <input id="student-name" name="studentName" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>탑승 장소</span>
          <input id="pickup-place" name="pickupPlace" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span class="field-label-row">
            <span>기사님 전달 메모</span>
            <span id="memo-count" class="character-count">0/20자</span>
          </span>
          <input
            id="student-memo"
            name="memo"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="예: 멀미 있음 · 앞자리 배정"
          >
        </label>

        <fieldset class="form-section">
          <legend>보호자 연락처</legend>
          <p id="parent-contact-helper" class="form-section__helper">
            기사님 화면의 전화·문자 버튼에 연결됩니다. 숫자를 입력하면 하이픈이 자동으로 표시됩니다.
          </p>

          <label class="field">
            <span>보호자 이름</span>
            <input id="parent-name" name="parentName" type="text" autocomplete="name">
          </label>

          <label class="field">
            <span>전화번호</span>
            <input
              id="parent-phone"
              name="parentPhone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel-national"
              maxlength="13"
              pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
              aria-describedby="parent-contact-helper"
              placeholder="010-1234-5678"
            >
          </label>
        </fieldset>

        <label class="checkbox-field">
          <input id="is-active" name="isActive" type="checkbox" checked>
          <span>출결 대상으로 이용 중</span>
        </label>

        <div class="dialog-actions">
          <button id="cancel-student-button" class="secondary-button" type="button">취소</button>
          <button id="save-student-button" class="primary-button" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <dialog id="deactivate-dialog" class="student-dialog">
      <form class="form-stack" method="dialog">
        <h2>원생 미이용 처리</h2>
        <p id="deactivate-message" class="helper-note"></p>
        <div class="dialog-actions">
          <button id="cancel-deactivate-button" class="secondary-button" type="button">취소</button>
          <button id="confirm-deactivate-button" class="danger-button" type="button">미이용 처리</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="../../src/app/admin/students.js?v=phone-format-2"></script>
  </body>
</html>
